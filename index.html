<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Urlaubswetter</title>
  <style>
    :root {
      --vanilla: #FEEFB6;
      --sky: #C3DAE8;
      --mocha: #432F2E;
    }
  
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      background: var(--sky);
      color: var(--mocha);
    }
  
    header {
      padding: 28px 18px;
      background: var(--vanilla);
      color: var(--mocha);
    }
  
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px;
    }
  
    h1 {
      margin: 0 0 6px;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -0.03em;
    }
  
    .hint {
      font-size: 14px;
      opacity: 0.8;
    }
  
    .grid {
      display: grid;
      gap: 16px;
    }
  
    .card {
      background: #fff7cf;
      border: 2px solid rgba(67,47,46,0.12);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 8px 22px rgba(67,47,46,0.12);
    }
  
    .top {
      margin-bottom: 16px;
    }
  
    .place {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.03em;
    }
  
    .date {
      font-size: 14px;
      opacity: 0.75;
    }
  
    .values {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
  
    .value {
      background: var(--mocha);
      color: var(--sky);
      border-radius: 18px;
      padding: 16px 12px;
      min-height: 190px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
  
    .part-label {
      font-size: 15px;
      font-weight: 800;
      color: var(--vanilla);
      margin-bottom: 8px;
    }
  
    .weather-icon {
      font-size: 56px;
      line-height: 1;
      margin: 8px 0 12px;
    }
  
    .number {
      font-size: 22px;
      font-weight: 900;
      color: var(--vanilla);
      margin-bottom: 8px;
    }
  
    .detail {
      font-size: 13px;
      line-height: 1.45;
      opacity: 0.95;
    }
  
    .error,
    .warning {
      background: var(--vanilla);
      color: var(--mocha);
    }

    .controls {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 18px;
        }

        select {
        padding: 12px;
        border-radius: 14px;
        border: 2px solid rgba(67,47,46,0.2);
        background: #FEEFB6;
        color: #432F2E;
        font-weight: 700;
        }

        @media (max-width: 650px) {
        .controls {
            grid-template-columns: 1fr;
        }
    }
  
    @media (max-width: 650px) {
      main {
        padding: 12px;
      }
  
      .values {
        grid-template-columns: 1fr;
      }
  
      .value {
        min-height: auto;
        padding: 18px;
      }
  
      .weather-icon {
        font-size: 64px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Urlaubswetter</h1>
    <div class="hint">Aktuelle Prognose für deine Route</div>
  </header>

  <main>
    <div class="controls">
        <select id="yearSelect"></select>
        <select id="shipSelect"></select>
        <select id="tripSelect"></select>
      </div>
    <div id="weather" class="grid"></div>
  </main>

  
  
  <script>
    let allTrips = [];
    let selectedStops = [];

    const yearSelect = document.getElementById("yearSelect");
    const shipSelect = document.getElementById("shipSelect");
    const tripSelect = document.getElementById("tripSelect");

    async function loadTrips() {
    const response = await fetch("trips.json");
    allTrips = await response.json();

    fillYears();
    updateShips();
    updateTrips();
    await updateWeatherFromSelection();
    }

    function fillYears() {
    const years = [...new Set(allTrips.map(trip => trip.year))].sort();

    yearSelect.innerHTML = years
        .map(year => `<option value="${year}">${year}</option>`)
        .join("");
    }

    function updateShips() {
    const selectedYear = yearSelect.value;

    const ships = [...new Set(
        allTrips
        .filter(trip => trip.year === selectedYear)
        .map(trip => trip.ship)
    )].sort();

    shipSelect.innerHTML = ships
        .map(ship => `<option value="${ship}">${ship}</option>`)
        .join("");
    }

    function updateTrips() {
    const selectedYear = yearSelect.value;
    const selectedShip = shipSelect.value;

    const trips = allTrips.filter(trip =>
        trip.year === selectedYear && trip.ship === selectedShip
    );

    tripSelect.innerHTML = trips
        .map((trip, index) => `
        <option value="${index}">
            ${formatDate(trip.date)} · ${trip.title}
        </option>
        `)
        .join("");
    }

    function getSelectedTrip() {
    const selectedYear = yearSelect.value;
    const selectedShip = shipSelect.value;

    const trips = allTrips.filter(trip =>
        trip.year === selectedYear && trip.ship === selectedShip
    );

    return trips[Number(tripSelect.value)];
    }

    async function updateWeatherFromSelection() {
    const selectedTrip = getSelectedTrip();

    if (!selectedTrip) {
        weatherBox.innerHTML = "<p>Keine Reise gefunden.</p>";
        return;
    }

    selectedStops = selectedTrip.stops;
    weatherBox.innerHTML = "<p>Lade Wetterdaten...</p>";

    try {
        const results = await Promise.all(selectedStops.map(fetchWeather));
        weatherBox.innerHTML = results.map(renderCard).join("");
    } catch {
        weatherBox.innerHTML = `
        <section class="card error">
            Wetter konnte nicht geladen werden.
        </section>
        `;
    }
    }

    yearSelect.addEventListener("change", async () => {
    updateShips();
    updateTrips();
    await updateWeatherFromSelection();
    });

    shipSelect.addEventListener("change", async () => {
    updateTrips();
    await updateWeatherFromSelection();
    });

    tripSelect.addEventListener("change", updateWeatherFromSelection);

    loadTrips();
  
    const weatherBox = document.getElementById("weather");
  
    const dayParts = [
      { label: "Vormittag", from: 6, to: 12 },
      { label: "Nachmittag", from: 12, to: 18 },
      { label: "Abend", from: 18, to: 24 },
      { label: "Nacht", from: 0, to: 6 }
    ];
  
    function formatDate(dateString) {
      return new Date(dateString + "T12:00:00").toLocaleDateString("de-DE", {
        weekday: "short",
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }
  
    function weatherInfo(code) {
      if ([0].includes(code)) return { icon: "☀️", text: "Klar" };
      if ([1, 2].includes(code)) return { icon: "🌤️", text: "Teils bewölkt" };
      if ([3].includes(code)) return { icon: "☁️", text: "Bewölkt" };
      if ([45, 48].includes(code)) return { icon: "🌫️", text: "Nebel" };
      if ([51, 53, 55, 56, 57].includes(code)) return { icon: "🌦️", text: "Nieselregen" };
      if ([61, 63, 65, 66, 67].includes(code)) return { icon: "🌧️", text: "Regen" };
      if ([71, 73, 75, 77].includes(code)) return { icon: "🌨️", text: "Schnee" };
      if ([80, 81, 82].includes(code)) return { icon: "🌦️", text: "Schauer" };
      if ([95, 96, 99].includes(code)) return { icon: "⛈️", text: "Gewitter" };
      return { icon: "❔", text: "Unklar" };
    }
  
    function avg(values) {
      const valid = values.filter(v => v !== null && v !== undefined);
      return valid.reduce((a, b) => a + b, 0) / valid.length;
    }
  
    function sum(values) {
      return values
        .filter(v => v !== null && v !== undefined)
        .reduce((a, b) => a + b, 0);
    }
  
    function max(values) {
      const valid = values.filter(v => v !== null && v !== undefined);
      return valid.length ? Math.max(...valid) : 0;
    }
  
    function mostFrequent(values) {
      const counts = {};
      values.forEach(v => {
        if (v !== null && v !== undefined) counts[v] = (counts[v] || 0) + 1;
      });
  
      return Number(
        Object.entries(counts).sort((a, b) => b[1] - a[1])[0]?.[0] ?? 0
      );
    }
  
    async function fetchWeather(stop) {
      const url =
        `https://api.open-meteo.com/v1/forecast?latitude=${stop.lat}&longitude=${stop.lon}` +
        `&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m` +
        `&timezone=auto&forecast_days=16`;
  
      const response = await fetch(url);
      if (!response.ok) throw new Error("Wetterdaten konnten nicht geladen werden.");
  
      const data = await response.json();
  
      const parts = dayParts.map(part => {
        const indexes = data.hourly.time
          .map((time, index) => ({ time, index }))
          .filter(item => {
            const hour = new Date(item.time).getHours();
            const date = item.time.slice(0, 10);
            return date === stop.date && hour >= part.from && hour < part.to;
          })
          .map(item => item.index);
  
        if (!indexes.length) return { ...part, unavailable: true };
  
        const temps = indexes.map(i => data.hourly.temperature_2m[i]);
        const rainProb = indexes.map(i => data.hourly.precipitation_probability[i]);
        const rain = indexes.map(i => data.hourly.precipitation[i]);
        const wind = indexes.map(i => data.hourly.wind_speed_10m[i]);
        const codes = indexes.map(i => data.hourly.weather_code[i]);
  
        return {
          ...part,
          unavailable: false,
          tempMin: Math.round(Math.min(...temps)),
          tempMax: Math.round(Math.max(...temps)),
          precipProbability: Math.round(max(rainProb)),
          precipitation: Number(sum(rain).toFixed(1)),
          wind: Math.round(max(wind)),
          weatherCode: mostFrequent(codes)
        };
      });
  
      return { stop, parts };
    }
  
    function renderPart(part) {
      if (part.unavailable) {
        return `
          <div class="value">
            <div class="part-label">${part.label}</div>
            <div class="weather-icon">—</div>
            <div class="detail">Noch nicht verfügbar</div>
          </div>
        `;
      }
  
      const info = weatherInfo(part.weatherCode);
  
      return `
        <div class="value">
          <div class="part-label">${part.label}</div>
          <div class="weather-icon">${info.icon}</div>
          <div class="number">${part.tempMin}–${part.tempMax} °C</div>
          <div class="detail">${info.text}</div>
          <div class="detail">Regen: ${part.precipProbability} % / ${part.precipitation} mm</div>
          <div class="detail">Wind: ${part.wind} km/h</div>
        </div>
      `;
    }
  
    function renderCard(result) {
      return `
        <section class="card">
          <div class="top">
            <div class="place">${result.stop.place}</div>
            <div class="date">${formatDate(result.stop.date)}</div>
          </div>
  
          <div class="values">
            ${result.parts.map(renderPart).join("")}
          </div>
        </section>
      `;
    }
  
    async function load() {
      weatherBox.innerHTML = "<p>Lade Wetterdaten...</p>";
  
      try {
        const results = await Promise.all(trip.map(fetchWeather));
        weatherBox.innerHTML = results.map(renderCard).join("");
      } catch (error) {
        weatherBox.innerHTML = `
          <section class="card error">
            Wetter konnte nicht geladen werden. Bitte später erneut versuchen.
          </section>
        `;
      }
    }
  
    load();
  </script>
</body>
</html>
