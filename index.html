<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Urlaubswetter</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #17202a;
    }

    header {
      padding: 24px 18px;
      background: #102a43;
      color: white;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .hint {
      opacity: 0.85;
      font-size: 14px;
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .place {
      font-size: 22px;
      font-weight: 750;
    }

    .date {
      color: #52616b;
      font-size: 14px;
    }

    .icon {
      font-size: 38px;
    }

    .values {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 16px;
    }

    .value {
      background: #f4f6f8;
      border-radius: 12px;
      padding: 10px;
    }

    .label {
      font-size: 12px;
      color: #64748b;
    }

    .number {
      font-size: 17px;
      font-weight: 700;
      margin-top: 4px;
    }

    .recommendation {
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      background: #eef6ff;
      font-size: 14px;
    }

    .warning {
      background: #fff7ed;
    }

    .error {
      background: #fee2e2;
      color: #7f1d1d;
    }

    @media (max-width: 650px) {
      .values {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Urlaubswetter</h1>
    <div class="hint">Aktuelle Prognose für deine Route</div>
  </header>

  <main>
    <div id="weather" class="grid"></div>
  </main>

  <script>
    const trip = [
      { place: "Kiel", lat: 54.3233, lon: 10.1228, date: "2026-05-16" },
      { place: "Bergen", lat: 60.39299, lon: 5.32415, date: "2026-05-18" },
      { place: "Flåm", lat: 60.8616, lon: 7.1140, date: "2026-05-19" },
      { place: "Ålesund", lat: 62.4722, lon: 6.1495, date: "2026-05-20" },
      { place: "Haugesund", lat: 59.4138, lon: 5.2680, date: "2026-05-21" }
    ];
  
    const weatherBox = document.getElementById("weather");
  
    const dayParts = [
      { key: "morning", label: "Vormittag", from: 6, to: 12 },
      { key: "afternoon", label: "Nachmittag", from: 12, to: 18 },
      { key: "evening", label: "Abend", from: 18, to: 24 },
      { key: "night", label: "Nacht", from: 0, to: 6 }
    ];
  
    function formatDate(dateString) {
      return new Date(dateString + "T12:00:00").toLocaleDateString("de-DE", {
        weekday: "short",
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }
  
    function weatherInfo(code) {
      if ([0].includes(code)) return { icon: "☀️", text: "Klar" };
      if ([1, 2].includes(code)) return { icon: "🌤️", text: "Teils bewölkt" };
      if ([3].includes(code)) return { icon: "☁️", text: "Bewölkt" };
      if ([45, 48].includes(code)) return { icon: "🌫️", text: "Nebel" };
      if ([51, 53, 55, 56, 57].includes(code)) return { icon: "🌦️", text: "Nieselregen" };
      if ([61, 63, 65, 66, 67].includes(code)) return { icon: "🌧️", text: "Regen" };
      if ([71, 73, 75, 77].includes(code)) return { icon: "🌨️", text: "Schnee" };
      if ([80, 81, 82].includes(code)) return { icon: "🌦️", text: "Schauer" };
      if ([95, 96, 99].includes(code)) return { icon: "⛈️", text: "Gewitter" };
      return { icon: "❔", text: "Unklar" };
    }
  
    function avg(values) {
      const valid = values.filter(v => v !== null && v !== undefined);
      if (!valid.length) return null;
      return valid.reduce((a, b) => a + b, 0) / valid.length;
    }
  
    function max(values) {
      const valid = values.filter(v => v !== null && v !== undefined);
      return valid.length ? Math.max(...valid) : null;
    }
  
    function sum(values) {
      const valid = values.filter(v => v !== null && v !== undefined);
      return valid.reduce((a, b) => a + b, 0);
    }
  
    function mostFrequent(values) {
      const counts = {};
      values.forEach(v => {
        if (v !== null && v !== undefined) counts[v] = (counts[v] || 0) + 1;
      });
  
      return Number(
        Object.entries(counts).sort((a, b) => b[1] - a[1])[0]?.[0] ?? 0
      );
    }
  
    function recommendation(part) {
      const tips = [];
  
      if (part.precipProbability >= 50 || part.precipitation >= 1.5) {
        tips.push("Regenjacke");
        tips.push("Buggy-Regenschutz");
      }
  
      if (part.wind >= 30) {
        tips.push("windfeste Kleidung");
      }
  
      if (part.temperature <= 10) {
        tips.push("warme Schicht");
      }
  
      if (part.temperature >= 18 && part.precipProbability < 40) {
        tips.push("Sonnenschutz");
      }
  
      return tips.length ? tips.join(" · ") : "unproblematisch";
    }
  
    async function fetchWeather(stop) {
      const url =
        `https://api.open-meteo.com/v1/forecast?latitude=${stop.lat}&longitude=${stop.lon}` +
        `&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m` +
        `&timezone=auto&forecast_days=16`;
  
      const response = await fetch(url);
      if (!response.ok) throw new Error("Wetterdaten konnten nicht geladen werden.");
  
      const data = await response.json();
  
      const parts = dayParts.map(part => {
        const indexes = data.hourly.time
          .map((time, index) => ({ time, index }))
          .filter(item => {
            const d = new Date(item.time);
            const hour = d.getHours();
            const date = item.time.slice(0, 10);
  
            return date === stop.date && hour >= part.from && hour < part.to;
          })
          .map(item => item.index);
  
        if (!indexes.length) {
          return {
            ...part,
            unavailable: true
          };
        }
  
        const temps = indexes.map(i => data.hourly.temperature_2m[i]);
        const rainProb = indexes.map(i => data.hourly.precipitation_probability[i]);
        const rain = indexes.map(i => data.hourly.precipitation[i]);
        const wind = indexes.map(i => data.hourly.wind_speed_10m[i]);
        const codes = indexes.map(i => data.hourly.weather_code[i]);
  
        return {
          ...part,
          unavailable: false,
          temperature: Math.round(avg(temps)),
          tempMin: Math.round(Math.min(...temps)),
          tempMax: Math.round(Math.max(...temps)),
          precipProbability: Math.round(max(rainProb) ?? 0),
          precipitation: Number(sum(rain).toFixed(1)),
          wind: Math.round(max(wind) ?? 0),
          weatherCode: mostFrequent(codes)
        };
      });
  
      return { stop, parts };
    }
  
    function renderPart(part) {
      if (part.unavailable) {
        return `
          <div class="value">
            <div class="label">${part.label}</div>
            <div class="number">Noch nicht verfügbar</div>
          </div>
        `;
      }
  
      const info = weatherInfo(part.weatherCode);
  
      return `
        <div class="value">
          <div class="label">${part.label} ${info.icon}</div>
          <div class="number">${part.tempMin}–${part.tempMax} °C</div>
          <div class="label">${info.text}</div>
          <div class="label">Regen: ${part.precipProbability} % / ${part.precipitation} mm</div>
          <div class="label">Wind: ${part.wind} km/h</div>
          <div class="label">Tipp: ${recommendation(part)}</div>
        </div>
      `;
    }
  
    function renderCard(result) {
      return `
        <section class="card">
          <div class="top">
            <div>
              <div class="place">${result.stop.place}</div>
              <div class="date">${formatDate(result.stop.date)}</div>
            </div>
          </div>
  
          <div class="values">
            ${result.parts.map(renderPart).join("")}
          </div>
        </section>
      `;
    }
  
    async function load() {
      weatherBox.innerHTML = "<p>Lade Wetterdaten...</p>";
  
      try {
        const results = await Promise.all(trip.map(fetchWeather));
        weatherBox.innerHTML = results.map(renderCard).join("");
      } catch (error) {
        weatherBox.innerHTML = `
          <section class="card error">
            Wetter konnte nicht geladen werden. Bitte später erneut versuchen.
          </section>
        `;
      }
    }
  
    load();
  </script>
</body>
</html>
